services:
  - type: web
    name: learnflow-backend
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: learnflow-postgres
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: SUPERADMIN_NAME
        value: Platform Owner
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: learnflow-postgres
    plan: free
    databaseName: learnflow
    user: learnflow
